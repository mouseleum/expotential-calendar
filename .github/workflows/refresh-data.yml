# Weekly data refresh: scrape all sources, merge, classify (if an Anthropic
# API key is configured), and commit the result. Vercel auto-deploys the push.
name: Refresh data

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - run: npm run scrape:expostands
      - run: npm run scrape:eventseye
      - run: npm run merge
      - name: Classify with Haiku
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The classify scripts tolerate per-batch API failures (e.g. exhausted
        # credits) and exit 0, so a refresh still lands without classification.
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            npm run classify:industry
            npm run classify:audience
          else
            echo "ANTHROPIC_API_KEY secret not set — skipping classification"
          fi
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Automated data refresh $(date -u +%F)"
            git push
          fi
